<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>수식Chat to HWPX/PDF</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="popup-shell">
  <header class="brand"><img src="../icons/icon.svg" width="32" height="32" alt=""><div><span class="eyebrow">CROW SCIENCE LAB.</span><h1>수식Chat <span>to HWPX/PDF</span></h1><p>AI Chat을 편집 가능한 Hwp와 Pdf로</p></div></header>
  <div class="context"><span class="dot"></span><span id="site-label">현재 페이지 확인 중…</span><span class="local-badge">내 PC에서 처리</span></div>
  <section id="actions" hidden aria-label="형식과 내보낼 범위"><div class="export-grid">
    <section class="format-column"><h2>PDF</h2><p>인쇄 · 공유</p><button type="button" data-mode="current">현재 답변</button><button type="button" data-mode="conversation">전체 대화</button><button type="button" data-mode="selection">선택 영역</button></section>
    <section class="format-column primary"><h2>HWPX</h2><p>한글에서 편집</p><button type="button" data-hwp-mode="current">현재 답변</button><button type="button" data-hwp-mode="conversation">전체 대화</button><button type="button" data-hwp-mode="selection">선택 영역</button></section>
  </div><div id="notebook-actions" hidden><p class="section-label">현재 메모</p><div class="note-grid"><button type="button" data-mode="note">PDF</button><button type="button" data-hwp-mode="note">HWPX</button></div></div></section>
  <p id="unsupported" class="notice" hidden>웹 대화 페이지에서 사용하세요.</p>
  <details id="settings-panel"><summary>출력 설정 <span>포함 항목 · 용지</span></summary><div class="settings">
    <fieldset><legend>포함</legend><label><input id="include-title" type="checkbox" checked> 제목</label><label><input id="include-date" type="checkbox" checked> 날짜</label><label><input id="include-user" type="checkbox" checked> 질문</label><label><input id="include-assistant" type="checkbox" checked> 답변</label></fieldset>
    <fieldset><legend>PDF 용지</legend><label><input type="radio" name="orientation" value="portrait" checked> A4 세로</label><label><input type="radio" name="orientation" value="landscape"> A4 가로</label></fieldset>
    <fieldset><legend>PDF 여백</legend><label><input type="radio" name="margin" value="default" checked> 기본</label><label><input type="radio" name="margin" value="narrow"> 좁게</label></fieldset>
    <label><input id="wrap-code" type="checkbox" checked> 긴 코드 줄바꿈</label>
    <label>수식 읽기 <select id="math-source"><option value="auto">자동</option><option value="latex">LaTeX 원문 우선</option><option value="mathml">MathML 구조 우선</option></select></label>
  </div></details>
  <div class="helper-row"><button type="button" id="check-native">도우미 연결 확인</button><button type="button" id="open-setup">설치 · 저장 폴더</button></div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <footer><span class="feather-line"></span><span>Crow Science Lab.</span><span class="version">Crow Ink · <span id="app-version"></span></span></footer>
</main><script src="../release-config.js"></script><script src="../helper-client.js"></script><script src="popup.js"></script></body></html>
