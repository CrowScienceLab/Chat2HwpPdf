<h1>편집 가능한 수식 패키지 검사</h1>
<div id="source">
<p>문장 속 <math><mi>F</mi><mo>=</mo><mi>m</mi><mi>a</mi></math> 수식 뒤 문장.</p>
<p><math display="block"><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>(</mo><msub><mi>v</mi><mn>0</mn></msub><mi>sin</mi><mi>θ</mi><mo>+</mo><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>b</mi></mfrac><mo>)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>b</mi><mi>t</mi><mo>/</mo><mi>m</mi></mrow></msup><mo>−</mo><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>b</mi></mfrac></math></p>
<p>정적분 <math><msubsup><mo>∫</mo><mn>0</mn><mi>t</mi></msubsup><mi>v</mi><mo>(</mo><mi>s</mi><mo>)</mo><mi>d</mi><mi>s</mi></math> 와 뒤 문장.</p>
<p>표 안 수식도 확인합니다.</p>
<table border="1"><tr><td>근호</td><td><math><msqrt><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></msqrt></math></td></tr></table>
<p class="katex-display"><span class="katex"><span class="katex-mathml"><math><semantics><mrow><mi>E</mi><mo>=</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">E=mc^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true">중복 시각 표현 (문서에 없어야 함)</span></span></p>
<p><span data-latex="\int e^{-bt/m}dt=-\frac{m}{b}e^{-bt/m}+C" class="math">LaTeX 원문 경로</span></p>
<p><math><msub><mover accent="true"><mi>F</mi><mo>⃗</mo></mover><mrow><mi mathvariant="normal">d</mi><mi mathvariant="normal">r</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">g</mi></mrow></msub><mo>∝</mo><msup><mi>v</mi><mn>2</mn></msup></math></p>
<p><math><menclose notation="box"><mrow><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mo>⋯</mo></mrow></menclose></math></p>
